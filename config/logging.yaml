version: 1
disable_existing_loggers: false

formatters:
  simple:
    format: "[%(asctime)s] %(levelname)s - %(name)s - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    formatter: simple
    stream: ext://sys.stdout

  file:
    class: logging.handlers.RotatingFileHandler
    formatter: simple
    filename: logs/application.log
    maxBytes: 5242880
    backupCount: 3
    encoding: utf-8

# Every module logs through a named logger (ingestion, rag, api, ...) that inherits this.
root:
  level: INFO
  handlers: [console, file]
