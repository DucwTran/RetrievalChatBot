version: "1.0.0"

services:
  qdrant:
    image: qdrant/qdrant:latest # version moi nhat
    container_name: qdrant
    ports:
      - "6333:6333" # Rest API port
      - "6334:6334" # Web UI port
    volumes:
      - ./qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    # healthcheck:
    restart: unless-stopped
    networks:
      - chatbot-network

networks:
  chatbot-network:
    driver: bridge