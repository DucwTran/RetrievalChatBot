server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The browser only talks to this origin; API calls are proxied to the backend (no CORS).
    location ~ ^/(chat|sessions|health) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;   # local LLMs can be slow
    }

    location / {
        try_files $uri /index.html;
    }
}
